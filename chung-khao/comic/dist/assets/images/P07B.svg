<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">Ba món đồ cùng xuất hiện trong mục lục triển lãm</title>
  <desc id="desc">Ba thẻ hình minh họa một mảnh tranh dân gian, quảng trường và mô hình bia trơn, nối với nhau bằng các đường sáng.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1">
      <stop stop-color="#e7f4ef"/>
      <stop offset="1" stop-color="#b5d7d2"/>
    </linearGradient>
    <linearGradient id="glass" x2="0" y2="1">
      <stop stop-color="#fffdf8" stop-opacity=".97"/>
      <stop offset="1" stop-color="#eaf3ed" stop-opacity=".94"/>
    </linearGradient>
    <linearGradient id="glow" x2="1" y2="1">
      <stop stop-color="#67c6b7" stop-opacity=".05"/>
      <stop offset=".5" stop-color="#67c6b7" stop-opacity=".55"/>
      <stop offset="1" stop-color="#67c6b7" stop-opacity=".05"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#3e8290" opacity=".2"/>
    </pattern>
  </defs>
